    <rect x="508" y="56" width="220" height="210" rx="12" fill="#181e24" stroke="#2a333c"/>
    <text x="528" y="88" fill="#e8eef3" font-size="16" font-weight="700">Context</text>
    <text x="528" y="118" fill="#93a0ab" font-size="13">value / 60 min</text>
    <text x="528" y="140" fill="#93a0ab" font-size="13">ridge RAPM 5v5</text>
    <text x="528" y="162" fill="#93a0ab" font-size="13">own +, opponent -</text>
    <text x="528" y="184" fill="#93a0ab" font-size="13">rink_type, not 12 leagues</text>
