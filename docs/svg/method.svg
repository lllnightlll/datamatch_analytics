    <text x="288" y="140" fill="#93a0ab" font-size="13">steal: +T</text>
    <text x="288" y="162" fill="#93a0ab" font-size="13">turnover: -T</text>
    <text x="288" y="184" fill="#93a0ab" font-size="13">entry / exit vs zone</text>
