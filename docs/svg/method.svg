    <text x="48" y="140" fill="#93a0ab" font-size="13">P(same-team shot</text>
    <text x="48" y="160" fill="#93a0ab" font-size="13">within 12 events)</text>
    <text x="48" y="212" fill="#3db8c5" font-size="13">fit on train</text>
    <text x="48" y="236" fill="#93a0ab" font-size="12">Bayes if n is small</text>
    <rect x="268" y="56" width="220" height="210" rx="12" fill="#181e24" stroke="#2a333c"/>
    <text x="288" y="88" fill="#e8eef3" font-size="16" font-weight="700">Δ threat</text>
